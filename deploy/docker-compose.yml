# juicer production stack — deployed via Woodpecker CI/CD
# Registry: 192.168.1.101:5000/kuukan-app/juicer-*
# Domain: juicer.kuukan.dev (Traefik on infra network)

services:
  db:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: juicer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: -p ${POSTGRES_PORT:-5432}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${POSTGRES_PORT}"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: 192.168.1.101:5000/kuukan-app/juicer-backend:${JUICER_RELEASE:?Use deploy.sh to select a release}
    profiles: [tools]
    command: ["/juicer-server", "migrate"]
    restart: "no"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: 192.168.1.101:5000/kuukan-app/juicer-backend:${JUICER_RELEASE:?Use deploy.sh to select a release}
    container_name: juicer-backend
    restart: unless-stopped
    env_file:
      - ${JUICER_ENV_FILE:?Use deploy.sh to select the host env file}
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.juicer-backend.rule=Host(`juicer.kuukan.dev`) && PathPrefix(`/backend`)"
      - "traefik.http.routers.juicer-backend.entrypoints=websecure"
      - "traefik.http.routers.juicer-backend.tls.certresolver=cloudflare"
      - "traefik.http.routers.juicer-backend.middlewares=juicer-backend-stripprefix,default-chain@file"
      - "traefik.http.middlewares.juicer-backend-stripprefix.stripprefix.prefixes=/backend"
      - "traefik.http.services.juicer-backend.loadbalancer.server.port=8000"

  frontend:
    image: 192.168.1.101:5000/kuukan-app/juicer-frontend:${JUICER_RELEASE:?Use deploy.sh to select a release}
    container_name: juicer-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - default
      - infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.juicer-frontend.rule=Host(`juicer.kuukan.dev`)"
      - "traefik.http.routers.juicer-frontend.entrypoints=websecure"
      - "traefik.http.routers.juicer-frontend.tls.certresolver=cloudflare"
      - "traefik.http.routers.juicer-frontend.priority=1"
      - "traefik.http.routers.juicer-frontend.middlewares=default-chain@file"
      - "traefik.http.services.juicer-frontend.loadbalancer.server.port=8080"

volumes:
  postgres_data:
    # Never let a changed project name silently create a replacement database.
    external: true
    name: ${POSTGRES_VOLUME_NAME:?Use deploy.sh to discover the existing volume}

networks:
  infra:
    external: true
